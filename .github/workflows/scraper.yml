name: Automated Recruitment Sync

on:
  schedule:
    - cron: '10 4 * * *'    # 9:40 AM IST
    - cron: '20 8 * * *'    # 1:50 PM IST
    - cron: '10 12 * * *'   # 5:40 PM IST
    - cron: '10 13 * * *'   # 6:40 PM IST
    - cron: '40 15 * * *'   # 9:10 PM IST
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi playwright playwright-stealth undetected-chromedriver
          playwright install chromium

      - name: Run Hybrid Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python multi_agent_scraper.py

      - name: Commit and Push Database
        run: |
          git config --global user.name "SarkariPortal-Bot"
          git config --global user.email "bot@sarkarinaukar.com"
          git add jobs_database.json
          git commit -m "Auto-sync recruitment feeds via heavy stealth scraper" || exit 0
          git pull --rebase origin main
          git push origin main
