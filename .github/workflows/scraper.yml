name: Automated Recruitment & The Hindu Sync

on:
  schedule:
    # 1. The Hindu Exam News Scraper (Subah 6:40 AM IST -> 10 1 * * *)
    - cron: '10 1 * * *'

    # 2. Recruitment Portals Scraper (Aapke exact schedule times)
    - cron: '10 2 * * *'    # Subah 7:40 AM IST
    - cron: '10 4 * * *'    # 9:40 AM IST
    - cron: '40 5 * * *'    # 11:10 AM IST
    - cron: '20 8 * * *'    # 1:50 PM IST
    - cron: '10 12 * * *'   # 5:40 PM IST
    - cron: '10 13 * * *'   # 6:40 PM IST
    - cron: '40 15 * * *'   # 9:10 PM IST

  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi playwright playwright-stealth undetected-chromedriver
          playwright install chromium

      # Step A: Run The Hindu Exam News Bot (Generates the_hindu_daily.json)
      - name: Run The Hindu Exam News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python the_hindu_bot.py

      # Step B: Run Hybrid Multi-Agent Recruitment Scraper (Generates jobs_database.json)
      - name: Run Hybrid Recruitment Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python multi_agent_scraper.py

      # Step C: Commit and Push Both Databases to GitHub
      - name: Commit and Push Databases
        run: |
          git config --global user.name "SarkariPortal-Bot"
          git config --global user.email "bot@sarkarinaukar.com"
          git add jobs_database.json the_hindu_daily.json
          git commit -m "Auto-sync recruitment feeds and The Hindu exam digest" || exit 0
          git pull --rebase origin main
          git push origin main
